name: aquatransport-observer

# https://mavericksforever.com/downloads/AquaTransport.dmg is overwritten in place: no versioned releases. This
# records what it is, daily, for Renovate (a custom datasource reading aquatransport.json from the
# aquatransport-observed branch) to propose bumps of templates/mavericks-aquatransport's pinned version and
# SHA-256. Two jobs, so upstream's bytes are never beside a token that can write (the family's rule; see
# mavergreen-swift's pins-bot.yml header):
# - observe (contents: read) downloads the DMG and reads it with 7z -- read, never run -- and uploads only a small
#   JSON.
# - publish (contents: write) touches no upstream byte and runs only code checked out at github.sha, never anything from
#   the artifact: it merges that JSON into the branch's aquatransport.json
#   (bin/observe-aquatransport.sh --merge keeps every version seen, each with its last-seen digest), and commits
#   and pushes only if the file changed. The token is in the environment of that last step alone; the merge
#   step has none. It never checks out or pushes main; the first run creates the branch as
#   an orphan.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: aquatransport-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Observe the live download
        run: |
          set -eu
          mkdir out
          sh bin/observe-aquatransport.sh out/observed.json

      - uses: actions/upload-artifact@v7
        with:
          name: observed
          path: out/
          if-no-files-found: error

  publish:
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: observed
          path: observed

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: src
          persist-credentials: false
          sparse-checkout: bin/observe-aquatransport.sh

      # No token here: this step runs the merge, and a public repo's branch is fetched without one.
      - name: Merge into the branch
        id: merge
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eu
          branch=aquatransport-observed
          git init -q branch
          cd branch
          url="https://github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$url" "$branch" >/dev/null; then
            git fetch -q --depth=1 "$url" "$branch"
            git checkout -q -b "$branch" FETCH_HEAD
          else
            git checkout -q --orphan "$branch"
          fi
          [ -f aquatransport.json ] || : > aquatransport.json
          sh ../src/bin/observe-aquatransport.sh --merge aquatransport.json ../observed/observed.json ../merged.json
          if cmp -s ../merged.json aquatransport.json; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The only step with the token: it commits the merged file and pushes it.
      - name: Commit and push
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          branch=aquatransport-observed
          cd branch
          url="https://github.com/${REPO}.git"
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          cp ../merged.json aquatransport.json
          version="$(python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1]))["releases"][0]; print(r["version"], r["digest"][:12])' ../observed/observed.json)"
          git add aquatransport.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "observe: AquaTransport ${version% *} (${version#* })"
          git -c "$auth" push "$url" "HEAD:refs/heads/${branch}"
