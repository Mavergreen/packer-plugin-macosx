name: ci

# What this repository can check without a Mac, a KVM host or 6 GB of
# Apple's media: the whole test suite and the three checks that guard the
# ingredient registry. template/'s own TestValidate (go test ./template/...)
# validates mavericks.pkr.hcl against real Packer, for every NIC choice; the
# `go` job's plain `go test -race ./...` still skips it (no `packer` on
# PATH there), but the `template` job below gives it both PACKER and
# PACKER_PLUGIN_PATH, so `packer validate` genuinely runs here on every
# push and PR.
#
# What it deliberately does NOT check: that an image builds. That needs
# nested virtualization, an InstallESD this project must never publish, and
# half an hour. Building an image is exercised on the host it is for.
# `packer validate` never executes a data source (see template/mavericks.pkr.hcl's
# own comment on ssh_private_key_file), so the `template` job fetches no
# Apple bytes either -- and must never be changed so that it does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so bin/verify-changed-sources.sh has a base revision
      # to diff assets/pins/sources.tsv against. With a shallow clone it would
      # find none and skip -- silently, which is the failure mode that
      # check exists to prevent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck

      - name: Test suite and the bash 3.2 floor
        run: ./bin/run-tests.sh

      # OURS ALONE: a release must contain no Apple-derived bytes. It passes
      # by construction -- the tool fetches Apple's media at runtime, on the
      # user's machine -- which is precisely why it is asserted rather than
      # assumed. See bin/no-apple-bytes.sh.
      - name: No Apple-derived bytes in a release
        run: ./bin/no-apple-bytes.sh

      # A Renovate bump moves a URL in assets/pins/sources.tsv and cannot compute
      # the checksum beside it. Without this the resulting PR is green and
      # the shared preset automerges a pin that will fail at fetch time.
      - name: Every changed source pin still verifies
        run: ./bin/verify-changed-sources.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  ingredient-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out shipyard (for the gate script)
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: v1
          path: .shipyard

      # Guards the ingredient-pin declaration against a glob that matches
      # nothing. We declare no repackage-on-ingredient-bump caller -- we
      # ship a recipe, so there is no artifact to repackage; INGREDIENTS.md
      # says so with the reason -- and this check passes trivially for a
      # repo with no caller. It is here so that the day a caller lands, the
      # gate is already watching it.
      - name: Ingredient pin declaration
        run: sh .shipyard/scripts/check-ingredient-pins.sh

      # An INGREDIENTS.md deviation with no reason is indistinguishable from
      # drift, so the family's own parser rejects it. Both of ours come from
      # decisions/0007.
      - name: Declared deviations all carry a reason
        run: sh .shipyard/scripts/deviations.sh .

  # the plugin itself: vet, tests, staticcheck, and builds for every host
  # it targets, not only the one CI runs on:
  # a darwin or netbsd build break is found here, not by a user.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # -race: internal/fetch's stall watcher cancels a download from
      # another goroutine, and internal/privops's staged-module cache is
      # shared, and locked, across a Backend's copies. template/'s own
      # TestValidate is in this ./... too, and skips here (no packer on
      # PATH) -- the `template` job below is where it actually runs.
      - name: Test
        run: go test -race ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      # docs/decisions/0005: the plugin cross-builds for every host it
      # names, not only the one it is measured on.
      - name: Cross-build
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 netbsd/amd64 netbsd/arm64; do
              GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/packer-plugin-mavericks
          done

  # template/mavericks.pkr.hcl against a REAL packer: `packer init`
  # fetches the qemu and vagrant plugins it required_plugins-pins (network,
  # same as any `packer init` run by a user), bin/dev-install.sh builds and
  # installs THIS checkout's own plugin beside them (no network -- it is
  # already on disk), and `packer validate` then resolves every data
  # source and post-processor block for real. go test ./template/...
  # exercises the same path through template/template_test.go's
  # TestValidate, with PACKER and PACKER_PLUGIN_PATH set so it runs rather
  # than skips (see that test's own doc comment).
  template:
    runs-on: ubuntu-latest
    env:
      PACKER: packer
      PACKER_PLUGIN_PATH: ${{ runner.temp }}/packer-plugins
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # Pinned by tag, not digest, the same as every other action in this
      # file (actions/checkout@v7, actions/setup-go@v7.0.0 above): none of
      # them are digest-pinned, so there is no convention to break.
      # Renovate's default github-actions manager tracks a tag pin exactly
      # as well as a digest one.
      - name: Set up Packer 1.16.1
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: "1.16.1"

      - name: Install this checkout's own plugin build
        run: ./bin/dev-install.sh

      # required_plugins names only qemu and vagrant (see mavericks.pkr.hcl's
      # own comment): this plugin has no release yet for `packer init` to
      # resolve, so it fetches nothing of ours -- bin/dev-install.sh above
      # is what puts it where validate/build find it.
      - name: packer init template/ (fetches the qemu and vagrant plugins)
        run: packer init template/

      - name: packer validate template/
        run: packer validate template/

      - name: go test ./template/ (TestValidate, not skipped)
        run: go test -race ./template/...

  # The go job cross-builds for darwin; this one RUNS the tests there.
  # flock semantics, sun_path's 104-byte limit and signal delivery are
  # host behaviour a cross-build cannot check.
  go-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...
