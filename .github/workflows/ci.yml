name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck

      - name: Test suite and the bash 3.2 floor
        run: ./bin/run-tests.sh
