name: gate

# The boot gate in CI (docs/decisions/0017): bin/gate.sh on GitHub's hosted KVM, from scratch (the
# base, the Aqua Transport layer for 10.9, 10 restarts), once for each release a change gates, and
# one required check, `gate`, whose first summary line is the verdict over all of them. It runs the
# local command; the logic around it is bin/gate-ci.sh, so nothing here reimplements the gate. 10.6
# is gated here like 10.9: bin/gate-ci.sh fetches CI's pinned copy of its install disc
# (snowleopard-disc-10A432, assets/pins/sources.tsv) before booting it.
#
#   - On a pull request: gated only when it is Renovate's and moves a `gate:` row of gate/scope.tsv
#     (the boot stack's pins and config.plists, Aqua Transport), on the releases that row names.
#     Everything else passes `gate` as "Not gated: <why>", without a runner booting anything; a
#     stale sources.tsv checksum fails it as "Pins not filled yet: <what to do>".
#   - Called by release.yml (workflow_call, input `caller`): always gated, on every release; the
#     control is the newest v0.* release before HEAD, or `control-ref`.
#   - Dispatched: as a pull request would be on that branch, or always, on every release, with
#     `force`.
#
# The jobs: scope decides, and names the releases (bin/gate-scope.sh); legs runs gate-release.yml
# once per release, side by side and each to its end (its candidate, candidate-retry and control
# legs, and why each runs, are described there); gate reads every release's evidence and decides.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Run the gate on this ref whatever it changed
        type: boolean
        default: false
  workflow_call:
    inputs:
      caller:
        description: Who called; a release is always gated (a called workflow's github.event_name is its caller's)
        type: string
        default: release
      control-ref:
        description: The ref the control runs; by default the newest v0.* release before HEAD
        type: string
        required: false
        default: ''

permissions:
  contents: read

# No workflow-level concurrency: called by release.yml, github.workflow is the caller's, and a
# group here would collide with its own. The jobs that boot, in gate-release.yml, each take one per
# release.

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.scope.outputs.decision }}
      reason: ${{ steps.scope.outputs.reason }}
      control_ref: ${{ steps.scope.outputs.control_ref }}
      event: ${{ steps.scope.outputs.event }}
      releases: ${{ steps.scope.outputs.releases }}
      release_list: ${{ steps.scope.outputs.release_list }}
    steps:
      # fetch-depth: 0 so there is a base to diff against and a merge base with origin/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # bin/verify-changed-sources.sh fetches a moved pin through shipyard's curl
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Is this change gated (bin/gate-scope.sh)
        id: scope
        env:
          GATE_EVENT: ${{ inputs.caller != '' && 'workflow_call' || github.event_name }}
          GATE_FORCE: ${{ inputs.force }}
          GATE_BRANCH: ${{ github.head_ref || github.ref_name }}
          GATE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GATE_CONTROL_REF: ${{ inputs.control-ref }}
        run: |
          set -euo pipefail
          if [ "$GATE_EVENT" = pull_request ]; then
            base=$GATE_PR_BASE
            head=$GATE_PR_HEAD
          else
            base=$(git merge-base origin/main HEAD)
            head=$(git rev-parse HEAD)
          fi
          # The first line is the decision and its reason; a gated change's second line names the
          # releases, which bin/gate-ci.sh makes into the legs' matrix (every release when not gated,
          # never an empty one) and the verdict's list (empty when not gated).
          out=$(bin/gate-scope.sh "$base" "$head" "$GATE_BRANCH" "$GATE_EVENT")
          line=${out%%$'\n'*}
          decision=${line%% *}
          reason=${line#* }
          releases=$(printf '%s\n' "$out" | bin/gate-ci.sh scope-releases)
          control_ref=
          if [ "$decision" = gated ]; then
            control_ref=$(bin/gate-ci.sh control-ref --event "$GATE_EVENT" --given "$GATE_CONTROL_REF" --pr-base "$GATE_PR_BASE")
          fi
          {
            echo "decision=$decision"
            echo "reason=$reason"
            echo "control_ref=$control_ref"
            echo "event=$GATE_EVENT"
            echo "$releases"
          } >> "$GITHUB_OUTPUT"
          echo "$line${control_ref:+ (control: $control_ref)}"
          printf '%s\n' "$releases"

  # One release's legs each, from the releases scope named: fail-fast: false, so one release's
  # failure never cancels another's, and the verdict reads every release's evidence. Not gated,
  # its `if` skips this job, yet its matrix still names every release: an empty fromJSON matrix
  # might fail the job before the `if` is read. The verdict passes a change that is not gated
  # whatever this job did, as it never reads needs.legs.result.
  legs:
    needs: scope
    if: needs.scope.outputs.decision == 'gated'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.scope.outputs.releases) }}
    uses: ./.github/workflows/gate-release.yml
    with:
      release: ${{ matrix.release }}
      control_ref: ${{ needs.scope.outputs.control_ref }}
      caller: ${{ needs.scope.outputs.event }}

  # The required check. always(): a skipped job would count as passing a required check of its
  # name, so this one runs whatever happened above, and passes only on a Passed: verdict or a
  # change that is not gated.
  gate:
    name: gate
    needs: [scope, legs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Merged, by pattern: a pattern matching one artifact extracts it flat into `path`, not into
      # path/<name>, and the verdict would find no steps.tsv. Each artifact holds one dir named after
      # itself, so merged they land at path/gate-<release>-<leg> however many matched.
      # continue-on-error: a leg that did not run uploaded nothing, and the verdict says so.
      - name: Download every leg's evidence
        if: needs.scope.outputs.decision == 'gated'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: gate-*
          merge-multiple: true
          path: ${{ runner.temp }}/gate-artifacts

      - name: The verdict (bin/gate-ci.sh verdict)
        env:
          GATE_DECISION: ${{ needs.scope.outputs.decision }}
          GATE_REASON: ${{ needs.scope.outputs.reason }}
          GATE_SCOPE_JOB: ${{ needs.scope.result }}
          GATE_RELEASES: ${{ needs.scope.outputs.release_list }}
        run: |
          set -uo pipefail
          rc=0
          bin/gate-ci.sh verdict --decision "$GATE_DECISION" --reason "$GATE_REASON" --scope-job "$GATE_SCOPE_JOB" \
            --releases "$GATE_RELEASES" --artifacts "$RUNNER_TEMP/gate-artifacts" > "$RUNNER_TEMP/verdict.md" || rc=$?
          cat "$RUNNER_TEMP/verdict.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/verdict.md"
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=gate::$(head -n 1 "$RUNNER_TEMP/verdict.md")"
          else
            echo "::error title=gate::$(head -n 1 "$RUNNER_TEMP/verdict.md")"
          fi
          exit "$rc"
